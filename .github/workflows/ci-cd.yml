name: SoftCodeSolution Enterprise CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint-test-backup:
    name: Backend Lint, Unit/Integration Tests & Backup Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install backend dependencies
        run: npm ci

      - name: Syntax & static checks
        run: npm run lint

      - name: Run CryptoVault, Observability & API Integration Tests
        run: npm test
        env:
          ARGON2_MEMORY_KB: '16384'

      - name: Verify SQLite Backup & Restore Integrity
        run: npm run verify:backup

  frontend-tests-and-build:
    name: Angular 21 Unit Tests & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install root & frontend dependencies
        run: npm ci && cd frontend && npm ci

      - name: Run Angular Vitest suite
        run: npm run test:frontend

      - name: Build production bundle
        run: npm run build

  concurrency-load-gate:
    name: Concurrency & SQLite WAL Load Gate
    needs: [backend-lint-test-backup]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Execute multi-tenant concurrency load test
        run: npm run test:load
        env:
          SCS_LOAD_CONCURRENCY: '24'
          SCS_LOAD_DURATION_SEC: '5'

  deploy-production:
    name: Deploy to Cloud Run (Main Branch Only)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [backend-lint-test-backup, frontend-tests-and-build, concurrency-load-gate]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check deployment credentials
        id: creds
        run: |
          if [ -n "${{ secrets.GCP_PROJECT_ID }}" ] && [ -n "${{ secrets.GCP_SA_KEY }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "GCP secrets not set yet; skipping Cloud Run rollout cleanly."
          fi

      - name: Authenticate to Google Cloud
        if: steps.creds.outputs.configured == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Cloud SDK
        if: steps.creds.outputs.configured == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy SoftCodeSolution to Cloud Run
        if: steps.creds.outputs.configured == 'true'
        run: |
          gcloud run deploy softcodesolution-enterprise \
            --source . \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION || 'asia-southeast1' }}" \
            --allow-unauthenticated
