
<!-- ===================================================== -->
<!-- SoftCodeSolution Enterprise Module Manager V2         -->
<!-- Premium Vibe Update                                   -->
<!-- ===================================================== -->

<div class="fixed right-4 top-4 bottom-4 z-[9999] pointer-events-none">
  <!-- Enterprise Flyout -->
  <aside
    class="right-4
           top-4
           w-[420px]
           max-w-[92vw]
           h-[82vh]
           max-h-[calc(100vh-2rem)]
           rounded-[24px]
           border
           border-slate-200/70
           bg-white
           shadow-[0_24px_64px_rgba(15,23,42,.15)]
           overflow-hidden
           pointer-events-auto
           flex
           flex-col">

    <!-- Header -->
    <header class="relative px-6 py-6 border-b border-slate-100 shrink-0 overflow-hidden">
       <div class="absolute inset-0 bg-[linear-gradient(to_right,#8080800a_1px,transparent_1px),linear-gradient(to_bottom,#8080800a_1px,transparent_1px)] bg-[size:12px_12px]"></div>
       
       <div class="relative flex items-start justify-between">
         <div class="space-y-1.5">
           <h1 class="text-xl font-extrabold text-slate-900 tracking-tight">Module Manager</h1>
           <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Enterprise Dashboard Configuration</p>
         </div>
         <button (click)="onClose()" class="w-8 h-8 rounded-full flex items-center justify-center text-slate-400 hover:text-slate-900 hover:bg-slate-100 transition-colors">
           <lucide-angular [img]="icons.X" class="w-4 h-4"></lucide-angular>
         </button>
       </div>

       <!-- Search -->
       <div class="relative mt-6">
          <div class="flex items-center gap-3 bg-slate-50 border border-slate-200/70 rounded-[16px] px-4 py-3 focus-within:bg-white focus-within:border-indigo-500 focus-within:shadow-sm transition-all">
             <lucide-angular [img]="icons.Search" class="w-4 h-4 text-slate-400"></lucide-angular>
             <input (input)="onSearch($event)" placeholder="Search modules..." class="flex-1 bg-transparent border-0 text-sm font-semibold text-slate-900 placeholder:text-slate-400 focus:outline-none focus:ring-0 w-full" />
          </div>
       </div>
    </header>

    <!-- Body -->
    <section class="min-h-0 flex-1 overflow-y-auto overscroll-contain p-2 scrollbar-thin bg-slate-50/30">
       <div class="space-y-1">
          <div *ngFor="let module of filteredModules" 
               class="group flex items-center justify-between p-3 rounded-[16px] border border-transparent hover:border-slate-200/60 hover:bg-white hover:shadow-[0_4px_12px_rgba(0,0,0,0.03)] transition-all cursor-pointer">
             <div class="flex items-center gap-3.5">
                <div class="w-10 h-10 rounded-[12px] bg-slate-100/80 border border-slate-200/60 flex items-center justify-center group-hover:bg-indigo-50 group-hover:border-indigo-100 transition-colors shrink-0">
                   <lucide-angular [img]="icons.Folder" class="w-4 h-4 text-slate-500 group-hover:text-indigo-600"></lucide-angular>
                </div>
                <div class="min-w-0">
                   <div class="text-sm font-bold text-slate-900 tracking-tight truncate">{{module.label}}</div>
                   <div class="text-[11px] font-medium text-slate-500 truncate">{{module.code}}</div>
                </div>
             </div>
             <div class="flex items-center">
                <button type="button" (click)="toggleHidden(module)" 
                        class="w-8 h-8 rounded-full flex items-center justify-center text-slate-400 hover:text-slate-900 hover:bg-slate-100 transition-colors"
                        [title]="module.hidden ? 'Show module' : 'Hide module'">
                   <lucide-angular [img]="module.hidden ? icons.EyeOff : icons.Eye" class="w-4 h-4"></lucide-angular>
                </button>
             </div>
          </div>
       </div>
    </section>

    <!-- Footer -->
    <footer class="border-t border-slate-100 bg-white px-6 py-4 flex justify-end shrink-0">
       <button type="button" (click)="onClose()" class="px-6 py-2.5 rounded-[16px] bg-white border border-slate-200 text-slate-700 text-sm font-bold hover:bg-slate-50 hover:text-slate-900 transition-colors shadow-sm">
          Close
       </button>
    </footer>

  </aside>
</div>
