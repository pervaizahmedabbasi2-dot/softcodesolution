
<!-- ===================================================== -->
<!-- SoftCodeSolution Enterprise Module Manager V2         -->
<!-- Phase 5.7 Installer 1                                 -->
<!-- ===================================================== -->

<div class="fixed right-4 top-4 bottom-4 z-[9999] pointer-events-none">
  <!-- Enterprise Flyout -->


  <aside
    class="right-4
           top-4
           w-[392px]
           max-w-[92vw]
           h-[82vh]
           max-h-[calc(100vh-2rem)]
           rounded-2xl
           border
           border-slate-200/70
           bg-white/95
           backdrop-blur-xl
           shadow-[0_24px_64px_rgba(15,23,42,.20)]
           overflow-hidden
           pointer-events-auto
           flex
           flex-col">

    <!-- Header -->

    <header
      class="border-b
             px-4 py-3">

      <div class="flex items-start justify-between">

        <div>

          <h1
            class="text-lg
                   font-black
                   tracking-tight
                   text-slate-900">

            Module Manager

          </h1>

          <p
            class="mt-1
                   text-xs
                   text-slate-500">

            Enterprise Dashboard Configuration

          </p>

        </div>

        <button
          (click)="onClose()"
          class="h-8
                 w-8
                 rounded-lg
                 border
                 border-transparent
                 transition-all
                 duration-150
                 hover:bg-slate-100
                 hover:border-slate-200">

          ✕

        </button>

      </div>

      <!-- Search -->

      <!-- SCS_HEADER_POLISH_V1 -->
<!-- SCS_CHROME_SEARCH_V1 -->

<div class="mt-3">

  <div
    class="flex items-center gap-3
           rounded-2xl
           border border-slate-200
           bg-slate-50
           px-3 py-2
           transition
           focus-within:border-blue-500
           focus-within:bg-white
           focus-within:shadow-sm">

    <lucide-angular
      [img]="icons.Search"
      class="h-4 w-4 text-slate-400">
    </lucide-angular>

    <input
      (input)="onSearch($event)"
      placeholder="Search modules..."
      class="flex-1
             border-0
             bg-transparent
             text-sm
             outline-none
             placeholder:text-slate-400"/>

  </div>

</div>

    </header>

    <!-- Body -->

    <section
      class="min-h-0
             flex-1
             overflow-y-auto
             overscroll-contain
             p-3
             scrollbar-thin">



<!-- SCS_REAL_MODULE_LIST_V1 -->
<!-- SCS_ROW_POLISH_V1 -->
<!-- SCS_ACTIVE_ROW_V1 -->


<div class="space-y-1">

  <div
    *ngFor="let module of filteredModules"
    class="group
       SCS_PHASE625_UI_POLISH
           flex
           items-center
           justify-between
           rounded-xl
border
border-transparent
px-3
py-2.5
transition-all
duration-150
hover:bg-blue-50/70 hover:border-blue-300

           cursor-pointer
           hover:border-slate-300
           hover:shadow-md
           active:scale-[0.98]
           duration-150">

    <div class="flex items-center gap-3">

      <lucide-angular
        [img]="icons.Folder"
        class="h-4 w-4 text-slate-500">
      </lucide-angular>

      <div>

        <div
          class="text-sm
                 font-semibold
                 text-slate-800
                 group-hover:text-slate-900">

          {{module.label}}

        </div>

        <div
          class="text-xs
                 text-slate-500
                 group-hover:text-slate-600">

          {{module.code}}

        </div>

      </div>

    </div>

    <div class="flex items-center gap-1">

  <button
    type="button"
    (click)="togglePinned(module)" style="display:none"
    class="h-8 w-8 rounded-lg flex items-center justify-center transition hover:bg-slate-200">

    <lucide-angular
      [img]="icons.Pin"
      class="h-[16px] w-[16px]">
    </lucide-angular>

  </button>

  <button
    type="button"
    (click)="toggleHidden(module)"
    class="h-8 w-8 rounded-lg flex items-center justify-center transition hover:bg-slate-200 cursor-pointer"
    [title]="module.hidden ? 'Show module' : 'Hide module'"
    [attr.aria-label]="module.hidden ? 'Show module' : 'Hide module'">
    <!-- SCS_PHASE626_EYE_UX -->

    <lucide-angular
      [img]="module.hidden ? icons.EyeOff : icons.Eye"
      class="h-[16px] w-[16px]">
    </lucide-angular>

  </button>

</div>

</div>

</div>


  </section>

    <!-- Footer -->


    <!-- SCS_PHASE666C_INSTANT_EYE_FOOTER -->
    <footer
      class="border-t
             px-6
             py-4
             flex
             justify-end">

      <button
        type="button"
        (click)="onClose()"
        class="rounded-2xl
               border
               px-5
               py-2
               hover:bg-slate-50">

        Close

      </button>

    </footer>

  </aside>

</div>
