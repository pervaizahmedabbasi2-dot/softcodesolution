<div class="min-h-screen flex overflow-hidden font-sans text-slate-800"
    [style.background-color]="customTheme.background">

    <aside [class.w-0]="!isSidebarOpen" [class.w-80]="isSidebarOpen" [style.background-color]="customTheme.sidebar"
        class="h-screen flex flex-col transition-all duration-500 relative z-50 shadow-2xl overflow-hidden">

        <div class="p-8 flex items-center justify-between border-b border-white/10 flex-shrink-0">
            <div (click)="toggleSidebar()" class="flex gap-2.5 cursor-pointer">
                <div class="w-3.5 h-3.5 rounded-full bg-[#ff5f56]"></div>
                <div class="w-3.5 h-3.5 rounded-full bg-[#ffbd2e]"></div>
                <div class="w-3.5 h-3.5 rounded-full bg-[#27c93f]"></div>
            </div>
            <span *ngIf="isSidebarOpen"
                class="text-[10px] font-black tracking-[4px] text-white/30 uppercase italic">Softcode V2</span>
        </div>

        <nav *ngIf="isSidebarOpen" class="flex-1 overflow-y-auto px-4 py-6 space-y-2 custom-scrollbar">
            <button (click)="navigateTo('home')"
                class="w-full flex items-center gap-4 px-5 py-4 rounded-2xl font-black text-[11px] uppercase tracking-widest transition-all mb-4 shadow-lg border border-white/10"
                [style.background-color]="activeView === 'home' ? 'white' : 'transparent'"
                [style.color]="activeView === 'home' ? customTheme.sidebar : 'white'">
                <lucide-icon [name]="icons.LayoutDashboard" class="w-4 h-4"></lucide-icon> Dashboard
            </button>

            <div *ngIf="userRole === 'CLIENT'">
                <div *ngFor="let cat of categories">
                    <button (click)="toggleDropdown(cat.id)"
                        class="w-full flex items-center justify-between px-5 py-3.5 text-white/80 hover:bg-white/10 hover:text-white rounded-2xl font-bold transition-all group">
                        <div class="flex items-center gap-4">
                            <lucide-icon [name]="cat.icon"
                                class="w-4 h-4 group-hover:scale-110 transition-transform"></lucide-icon>
                            <span class="text-[11px] uppercase tracking-wider">{{ cat.label }}</span>
                        </div>
                        <lucide-icon [name]="icons.Plus" class="w-3 h-3 opacity-50 transition-transform"
                            [style.transform]="openDropdowns[cat.id] ? 'rotate(45deg)' : ''"></lucide-icon>
                    </button>
                    <div *ngIf="openDropdowns[cat.id]"
                        class="ml-6 mt-1 mb-3 space-y-1 animate-in slide-in-from-top-2 duration-300">
                        <a (click)="navigateTo(cat.id + '-list')"
                            class="flex items-center gap-2 px-4 py-2 text-[10px] font-black text-white/60 hover:text-white cursor-pointer uppercase tracking-widest border-l-2 border-white/10 hover:border-white transition-all">{{
                            cat.list }}</a>
                        <a (click)="navigateTo(cat.id + '-add')"
                            class="flex items-center gap-2 px-4 py-2 text-[10px] font-black text-white/60 hover:text-white cursor-pointer uppercase tracking-widest border-l-2 border-white/10 hover:border-white transition-all">{{
                            cat.add }}</a>
                    </div>
                </div>
            </div>

            <div *ngIf="userRole === 'SUPER_ADMIN'" class="space-y-1">
                <p class="px-5 py-2 text-[9px] font-black text-white/30 uppercase tracking-widest">SaaS Management</p>
                <button (click)="navigateTo('all-tenants')"
                    class="w-full flex items-center gap-4 px-5 py-3 text-white/80 hover:bg-white/10 rounded-2xl font-bold transition-all">
                    <lucide-icon [name]="icons.Users" class="w-4 h-4 text-emerald-400"></lucide-icon>
                    <span class="text-[11px] uppercase">Manage All Clients</span>
                </button>
            </div>
        </nav>

        <div class="px-4 pb-4" *ngIf="isSidebarOpen">
            <button (click)="logout()"
                class="w-full flex items-center gap-4 px-5 py-4 rounded-2xl font-black text-[11px] uppercase tracking-widest transition-all text-white/70 hover:bg-red-500 hover:text-white group border border-white/5">
                <lucide-icon [name]="icons.LogOut"
                    class="w-4 h-4 group-hover:scale-110 transition-transform"></lucide-icon> Logout System
            </button>
        </div>

        <div class="p-6 border-t border-white/10">
            <div class="bg-white/5 rounded-2xl p-4 flex items-center gap-3 text-white border border-white/5">
                <div
                    class="w-10 h-10 rounded-xl bg-white/20 flex items-center justify-center font-black text-xs italic">
                    PA</div>
                <div *ngIf="isSidebarOpen">
                    <p class="text-[10px] font-black uppercase">{{ userName }}</p>
                    <p class="text-[8px] font-bold opacity-50 uppercase tracking-tighter">{{ userRole === 'SUPER_ADMIN'
                        ? 'SoftCode CEO' : 'Business Admin' }}</p>
                </div>
            </div>
        </div>
    </aside>

    <main class="flex-1 flex flex-col h-screen overflow-hidden">
        <header [style.background-color]="customTheme.header"
            class="h-24 border-b border-slate-200 px-10 flex items-center justify-between flex-shrink-0 z-40">
            <div class="flex items-center gap-6">
                <div *ngIf="!isSidebarOpen" (click)="toggleSidebar()"
                    class="flex gap-2 cursor-pointer p-3 bg-slate-100 rounded-xl">
                    <div class="w-2.5 h-2.5 rounded-full bg-[#ff5f56]"></div>
                    <div class="w-2.5 h-2.5 rounded-full bg-[#ffbd2e]"></div>
                    <div class="w-2.5 h-2.5 rounded-full bg-[#27c93f]"></div>
                </div>
                <h2 class="text-xl font-black text-slate-900 italic uppercase">Admin Core</h2>
            </div>
            <div class="relative">
                <button (click)="toggleThemeMenu()"
                    class="flex items-center gap-2 px-4 py-2 bg-slate-100 rounded-xl font-black text-[10px] uppercase tracking-widest shadow-sm hover:bg-slate-200 transition-all">
                    <lucide-icon [name]="icons.Palette" class="w-4 h-4 text-blue-600"></lucide-icon> Customize Colors
                </button>
                <div *ngIf="isThemeMenuOpen"
                    class="absolute right-0 top-full mt-4 w-72 bg-white rounded-[2rem] shadow-2xl border border-slate-100 p-6 z-50 animate-in slide-in-from-top-2">
                    <div class="space-y-4">
                        <div *ngFor="let part of ['sidebar', 'header', 'background', 'footer']">
                            <label class="text-[9px] font-black uppercase mb-2 block text-slate-400 tracking-widest">{{
                                part }}</label>
                            <div class="flex flex-wrap gap-2">
                                <button *ngFor="let c of colorOptions" (click)="updateColor(part, c.code)"
                                    [style.background-color]="c.code"
                                    class="w-6 h-6 rounded-full border border-slate-200 hover:scale-110 transition-transform shadow-sm"></button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <div class="flex-1 overflow-y-auto p-12">
            <div *ngIf="activeView === 'home'" class="max-w-7xl mx-auto space-y-12">
                <div class="text-center">
                    <h1 class="text-5xl font-black text-slate-900 italic uppercase leading-tight">Welcome <br> <span
                            class="text-blue-600">{{ userName }}</span></h1>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
                    <ng-container *ngIf="userRole === 'CLIENT'">
                        <div *ngFor="let cat of categories" (click)="toggleDropdown(cat.id)"
                            class="bg-white p-8 rounded-[3rem] border border-slate-100 shadow-sm hover:-translate-y-3 transition-all duration-500 group cursor-pointer text-center">
                            <div
                                class="w-16 h-16 rounded-[2rem] bg-slate-50 text-blue-600 flex items-center justify-center mx-auto mb-6 group-hover:bg-blue-600 group-hover:text-white transition-all shadow-inner">
                                <lucide-icon [name]="cat.icon" class="w-8 h-8"></lucide-icon></div>
                            <h3
                                class="text-sm font-black text-slate-800 uppercase tracking-widest italic leading-tight">
                                {{ cat.label }}</h3>
                        </div>
                    </ng-container>
                    <ng-container *ngIf="userRole === 'SUPER_ADMIN'">
                        <div class="bg-white p-8 rounded-[3rem] border-2 border-blue-600 shadow-xl text-center">
                            <h3 class="text-xs font-black text-slate-400 uppercase tracking-widest mb-2">Total Software
                                Clients</h3>
                            <p class="text-3xl font-black text-blue-600">Active Control</p>
                        </div>
                    </ng-container>
                </div>
            </div>
        </div>

        <footer [style.background-color]="customTheme.footer"
            class="h-16 border-t border-slate-200 px-12 flex items-center justify-center text-[9px] font-black text-slate-400 uppercase tracking-[4px]">
            <div class="flex items-center justify-center gap-3 text-center">
                <span>© 2026 <span class="text-slate-400">SOFTCODE SOLUTION</span>. ALL RIGHTS RESERVED.</span>
            </div>
        </footer>
    </main>
</div>
