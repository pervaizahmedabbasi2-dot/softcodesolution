<!-- SCS_DASHBOARD_SYSTEM_HEALTH_COMPONENT_V1_START -->
<div
  *ngIf="userRole === 'SUPER_ADMIN' && page"
  class="px-8 py-7 max-w-[98rem] mx-auto space-y-6">

  <div
    class="relative overflow-hidden rounded-[2rem] shadow-2xl"
    style="background:linear-gradient(135deg,#1e40af 0%,#1e3a8a 45%,#0f172a 100%)">

    <div
      class="absolute inset-0 opacity-10"
      style="background-image:radial-gradient(circle,#fff 1px,transparent 1px);background-size:28px 28px">
    </div>

    <div
      class="absolute -top-16 -right-16 w-80 h-80 rounded-full opacity-15"
      style="background:radial-gradient(circle,#60a5fa,transparent)">
    </div>

    <div
      class="relative px-7 py-7 flex flex-col lg:flex-row lg:items-center justify-between gap-5">

      <div>
        <div class="flex flex-wrap items-center gap-2 mb-3">
          <span
            class="px-3 py-1.5 rounded-full text-[10px] font-black uppercase tracking-[3px] text-white/80"
            style="background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.18)">
            {{ page.badge }}
          </span>

          <span class="text-[10px] text-white/50 font-bold">
            Frontend shell · backend next phase
          </span>
        </div>

        <h1
          class="text-3xl font-black text-white uppercase tracking-tight leading-tight">
          {{ page.title }}<span class="text-blue-300">.</span>
        </h1>

        <p
          class="text-sm text-white/45 font-medium mt-2 max-w-2xl">
          {{ page.subtitle }}
        </p>
      </div>

      <div
        class="w-16 h-16 rounded-2xl bg-white/10 flex items-center justify-center ring-1 ring-white/15">
        <lucide-icon
          [name]="page.icon"
          class="w-8 h-8 text-white">
        </lucide-icon>
      </div>
    </div>
  </div>

  <div class="flex flex-wrap gap-2">
    <button
      type="button"
      *ngFor="let link of page.quickLinks || []"
      (click)="openView(link.view)"
      class="px-4 py-2.5 rounded-xl bg-white border border-slate-200 text-slate-700 text-[10px] font-black uppercase tracking-widest hover:bg-blue-50 hover:border-blue-200 hover:text-blue-700 transition-all">
      {{ link.title }}
    </button>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-5">
    <div
      *ngFor="let group of page.groups || []"
      class="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden">

      <div class="px-5 py-4 border-b border-slate-100">
        <p
          class="text-[10px] font-black uppercase tracking-[0.25em] text-blue-500">
          Module Group
        </p>

        <h3
          class="mt-1 text-sm font-black text-slate-900 uppercase tracking-tight">
          {{ group.title }}
        </h3>
      </div>

      <div class="p-3 space-y-1">
        <div
          *ngFor="let item of group.items || []"
          class="flex items-center justify-between px-3 py-2.5 rounded-xl hover:bg-slate-50 transition-colors">

          <div class="flex items-center gap-2.5">
            <div
              class="w-2 h-2 rounded-full bg-emerald-500 flex-shrink-0">
            </div>

            <span class="text-xs font-semibold text-slate-700">
              {{ item }}
            </span>
          </div>

          <span
            class="text-[9px] font-black uppercase tracking-widest text-slate-300">
            Soon
          </span>
        </div>
      </div>
    </div>
  </div>
</div>
<!-- SCS_DASHBOARD_SYSTEM_HEALTH_COMPONENT_V1_END -->
