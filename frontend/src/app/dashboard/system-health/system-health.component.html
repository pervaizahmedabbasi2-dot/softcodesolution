<!-- SCS_DASHBOARD_SYSTEM_HEALTH_COMPONENT_V1_START -->
<div
  *ngIf="userRole === 'SUPER_ADMIN' && page"
  class="px-8 py-7 max-w-[98rem] mx-auto space-y-6">

  <div class="relative overflow-hidden rounded-[2rem] bg-white border border-slate-200/80 shadow-[0_8px_30px_rgb(0,0,0,0.04)]">
    <div class="absolute inset-0 bg-[linear-gradient(to_right,#80808012_1px,transparent_1px),linear-gradient(to_bottom,#80808012_1px,transparent_1px)] bg-[size:24px_24px]"></div>
    <div class="absolute -top-16 -right-16 w-80 h-80 rounded-full opacity-10 bg-gradient-to-br from-slate-100 to-transparent"></div>
    <div class="relative px-8 py-10 flex flex-col lg:flex-row lg:items-center justify-between gap-5">
      <div>
        <div class="flex flex-wrap items-center gap-2 mb-4">
          <span class="inline-flex items-center gap-2 px-2.5 py-1 rounded-full bg-slate-100/80 border border-slate-200/80 backdrop-blur-sm shadow-sm text-[10px] font-bold text-slate-700 uppercase tracking-widest">
            {{ page.badge }}
          </span>
          <span class="text-[10px] text-emerald-600 font-bold uppercase tracking-wider flex items-center gap-1.5 ml-2">
            <div class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></div>
            All Systems Operational
          </span>
        </div>
        <h1 class="text-3xl md:text-4xl font-extrabold text-slate-900 tracking-tight leading-tight">
          {{ page.title }}<span class="text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-cyan-500">.</span>
        </h1>
        <p class="text-base text-slate-500 font-medium mt-3 max-w-2xl leading-relaxed">
          {{ page.subtitle }}
        </p>
      </div>
      <div class="w-16 h-16 rounded-2xl bg-slate-50 flex items-center justify-center border border-slate-100 shadow-sm">
        <lucide-icon [name]="page.icon" class="w-8 h-8 text-slate-700"></lucide-icon>
      </div>
    </div>
  </div>

  <div class="flex flex-wrap gap-2">
    <button
      type="button"
      *ngFor="let link of page.quickLinks || []"
      (click)="openView(link.view)"
      class="px-4 py-2.5 rounded-xl bg-white border border-slate-200 text-slate-700 text-[10px] font-black uppercase tracking-widest hover:bg-blue-50 hover:border-blue-200 hover:text-blue-700 transition-all">
      {{ link.title }}
    </button>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-5">
    <div
      *ngFor="let group of page.groups || []"
      class="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden">

      <div class="px-5 py-4 border-b border-slate-100">
        <p
          class="text-[10px] font-black uppercase tracking-[0.25em] text-blue-500">
          Module Group
        </p>

        <h3
          class="mt-1 text-sm font-black text-slate-900 uppercase tracking-tight">
          {{ group.title }}
        </h3>
      </div>

      <div class="p-3 space-y-1">
        <div
          *ngFor="let item of group.items || []"
          class="flex items-center justify-between px-3 py-2.5 rounded-xl hover:bg-slate-50 transition-colors">

          <div class="flex items-center gap-2.5">
            <div
              class="w-2 h-2 rounded-full bg-emerald-500 flex-shrink-0">
            </div>

            <span class="text-xs font-semibold text-slate-700">
              {{ item }}
            </span>
          </div>

          <span
            class="text-[9px] font-black uppercase tracking-widest text-slate-300">
            Soon
          </span>
        </div>
      </div>
    </div>
  </div>
</div>
<!-- SCS_DASHBOARD_SYSTEM_HEALTH_COMPONENT_V1_END -->
