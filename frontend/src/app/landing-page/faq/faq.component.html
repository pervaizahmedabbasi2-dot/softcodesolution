<section id="faq" class="py-24 bg-white relative">
  <div class="container mx-auto px-6 lg:px-10 max-w-7xl relative z-10">
    <div class="mb-16">
      <div class="inline-flex items-center px-4 py-2 text-xs font-semibold text-indigo-700 bg-indigo-50 border border-indigo-100 rounded-full shadow-sm mb-6 uppercase tracking-widest">
        Support
      </div>
      <h2 class="text-3xl md:text-5xl font-extrabold text-slate-900 tracking-tight">
        Technical <span class="text-indigo-600">FAQ</span>
      </h2>
    </div>

    <div class="flex flex-col md:flex-row gap-12 lg:gap-20">
      <div class="md:w-1/3 lg:w-1/4 flex flex-col gap-2">
        <button *ngFor="let cat of getCategories()" (click)="setCategory(cat)"
          [ngClass]="selectedCategory === cat ? 'bg-indigo-50 text-indigo-700 border-indigo-500 shadow-sm' : 'text-slate-500 border-transparent hover:bg-slate-50'"
          class="w-full text-left px-6 py-4 rounded-2xl border-l-4 font-semibold text-sm transition-all duration-300">
          {{ cat }}
        </button>
      </div>
      <div class="md:w-2/3 lg:w-3/4">
        <div class="space-y-8 animate-[fadeIn_.3s_ease-out]">
          <div *ngFor="let item of faqData[selectedCategory]" class="bg-slate-50 rounded-[2rem] p-8 border border-slate-100 hover:shadow-sm transition-all">
            <h3 class="text-xl font-bold text-slate-900 mb-4 tracking-tight">
              {{ item.question }}
            </h3>
            <p class="text-slate-600 leading-relaxed text-base">
              {{ item.answer }}
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
