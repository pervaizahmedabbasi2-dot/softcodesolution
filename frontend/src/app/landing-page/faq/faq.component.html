<section id="faq" class="py-24 bg-white border-t border-slate-100">
  <div class="container mx-auto px-4 max-w-6xl">

    <div class="mb-20">
      <h2 class="text-2xl font-bold text-slate-900 flex items-center gap-3">
        <span class="w-2 h-8 bg-blue-600 rounded-full"></span>
        Technical Documentation & FAQ
      </h2>
    </div>

    <div class="flex flex-col md:flex-row gap-16">

      <div class="md:w-1/4 space-y-2">
        <button *ngFor="let cat of getCategories()" (click)="setCategory(cat)"
          [ngClass]="selectedCategory === cat ? 'bg-blue-50 text-blue-700 border-blue-600' : 'text-slate-500 border-transparent hover:bg-slate-50'"
          class="w-full text-left px-6 py-4 rounded-xl border-l-4 font-bold text-sm transition-all duration-300">
          {{ cat }}
        </button>
      </div>

      <div class="md:w-3/4">
        <div class="space-y-10 animate-fadeIn">
          <div *ngFor="let item of faqData[selectedCategory]" class="group">
            <h3 class="text-xl font-bold text-slate-800 mb-4 group-hover:text-blue-600 transition-colors">
              {{ item.question }}
            </h3>
            <p class="text-slate-600 leading-relaxed font-medium text-lg border-l-2 border-slate-100 pl-6">
              {{ item.answer }}
            </p>
          </div>
        </div>

      </div>

    </div>
  </div>
</section>
