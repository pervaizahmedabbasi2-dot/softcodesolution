<section class="py-24 bg-[#020617] relative overflow-hidden" style="perspective: 2000px;">
    <div class="absolute top-0 left-1/4 w-96 h-96 bg-blue-600/10 rounded-full blur-[120px]"></div>

    <div class="container mx-auto px-6 relative z-10">

        <div class="text-center mb-16" *ngIf="!selectedProduct()">
            <h2 class="text-5xl md:text-6xl font-black italic text-white uppercase tracking-tighter">
                SoftCode <span class="text-blue-600">Rental Store</span>
            </h2>
            <div class="h-1.5 w-24 bg-blue-600 mx-auto mt-4 rounded-full"></div>
            <p class="text-slate-500 font-bold mt-6 uppercase tracking-widest text-[10px]">Your Own Technology - No
                Third Party Dependencies</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-8" *ngIf="!selectedProduct()">
            <div *ngFor="let item of products()"
                class="group bg-white/5 border border-white/10 rounded-[3.5rem] p-8 hover:bg-white/10 transition-all duration-500 transform hover:rotate-x-12 hover:-translate-y-2 shadow-2xl">

                <div class="flex justify-between items-center mb-8">
                    <span class="text-6xl">{{item.icon}}</span>
                    <span
                        class="px-4 py-1 bg-blue-600/20 border border-blue-500/30 rounded-full text-[10px] font-black text-blue-400 uppercase tracking-widest">
                        {{item.category}}
                    </span>
                </div>

                <h3 class="text-3xl font-black italic text-white uppercase mb-4 tracking-tighter">{{item.name}}</h3>
                <p class="text-slate-400 text-xs font-bold italic mb-8 leading-relaxed">{{item.shortDesc}}</p>

                <div class="space-y-4">
                    <button (click)="viewDetails(item)"
                        class="w-full py-4 bg-white/5 border border-white/10 text-white font-black italic uppercase text-[11px] rounded-2xl hover:bg-white hover:text-slate-950 transition-all">
                        View Detailed Features
                    </button>
                    <button (click)="handleBooking(item.name)"
                        class="w-full py-4 bg-blue-600 text-white font-black italic uppercase text-[11px] rounded-2xl shadow-xl shadow-blue-600/20 hover:scale-105 active:scale-95 transition-all">
                        Rent This Software
                    </button>
                </div>
            </div>
        </div>

        <div class="max-w-5xl mx-auto" *ngIf="selectedProduct()">
            <button (click)="backToStore()"
                class="group flex items-center gap-2 text-blue-400 font-black italic uppercase text-[10px] tracking-[0.3em] mb-8 hover:text-white transition-all">
                ← Back to Store
            </button>

            <div class="bg-white/5 backdrop-blur-3xl border border-white/10 rounded-[4rem] p-12 relative overflow-hidden shadow-2xl"
                style="transform-style: preserve-3d;">

                <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-16 gap-8">
                    <div class="space-y-2">
                        <span
                            class="px-4 py-1.5 bg-blue-600/20 border border-blue-500/30 rounded-full text-[10px] font-black text-blue-400 uppercase tracking-widest">
                            {{selectedProduct().category}} Expert System
                        </span>
                        <h2 class="text-5xl md:text-7xl font-black italic text-white uppercase tracking-tighter mt-4">
                            {{selectedProduct().name}}</h2>
                    </div>
                    <div
                        class="bg-white/5 p-8 rounded-[2.5rem] border border-white/10 min-w-[220px] text-center md:text-right">
                        <div class="text-4xl font-black text-emerald-400 italic">RS {{selectedProduct().price}}</div>
                        <div class="text-slate-500 text-[10px] font-black uppercase mt-2 tracking-widest">Monthly Rent
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-16">
                    <div *ngFor="let detail of selectedProduct().fullDetails"
                        class="flex items-center gap-4 p-5 bg-white/[0.03] rounded-3xl border border-white/5 hover:bg-blue-600/10 hover:border-blue-500/20 transition-all group">
                        <div class="w-2.5 h-2.5 bg-blue-600 rounded-full shadow-[0_0_10px_rgba(37,99,235,0.8)]"></div>
                        <span class="text-slate-200 text-sm font-bold italic">{{detail}}</span>
                    </div>
                </div>

                <div class="flex flex-col md:flex-row gap-6 pt-10 border-t border-white/10">
                    <button (click)="handleBooking(selectedProduct().name)"
                        class="flex-[2] py-6 bg-blue-600 text-white font-black italic uppercase text-sm rounded-3xl hover:shadow-[0_0_40px_rgba(37,99,235,0.4)] transition-all transform hover:scale-[1.02]">
                        Confirm Rental Booking Now
                    </button>
                    <button (click)="backToStore()"
                        class="flex-1 py-6 bg-white/5 border border-white/10 text-white font-black italic uppercase text-sm rounded-3xl hover:bg-white/10 transition-all">
                        Cancel & Return
                    </button>
                </div>
            </div>
        </div>

    </div>
</section>
