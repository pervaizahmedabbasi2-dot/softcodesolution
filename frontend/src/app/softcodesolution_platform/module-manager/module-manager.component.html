
<!-- ===================================================== -->
<!-- SoftCodeSolution Enterprise Module Manager V2         -->
<!-- Executive 3D Frosted Flyout                           -->
<!-- ===================================================== -->

<div class="fixed right-4 top-4 bottom-4 z-[9999] pointer-events-none">
  <aside
    class="right-4 top-4 w-[420px] max-w-[92vw] h-[82vh] max-h-[calc(100vh-2rem)] rounded-[28px] border border-white/80 bg-white/95 backdrop-blur-2xl shadow-[0_24px_64px_rgba(15,23,42,0.18)] overflow-hidden pointer-events-auto flex flex-col">

    <!-- Frosted Executive Header -->
    <header class="relative px-6 py-5 border-b border-slate-200/80 bg-gradient-to-br from-white via-indigo-50/40 to-slate-50 shrink-0 overflow-hidden">
      <div class="relative flex items-start justify-between gap-3">
        <div class="flex items-start gap-3">
          <div class="w-11 h-11 rounded-2xl bg-gradient-to-br from-indigo-600 to-blue-600 text-white shadow-lg shadow-indigo-600/25 flex items-center justify-center shrink-0">
            <lucide-angular [img]="icons.Shield" class="w-5 h-5"></lucide-angular>
          </div>
          <div class="space-y-0.5">
            <span class="text-[10px] font-black text-indigo-600 uppercase tracking-widest block">Enterprise Governance</span>
            <h1 class="text-lg font-black text-slate-900 tracking-tight">Module Manager</h1>
            <p class="text-[11px] font-medium text-slate-500">Sidebar visibility &amp; active bundle control</p>
          </div>
        </div>
        <button type="button" (click)="onClose()" class="w-8 h-8 rounded-xl flex items-center justify-center text-slate-500 hover:text-slate-900 bg-white border border-slate-200 hover:bg-slate-100 transition-colors cursor-pointer">
          <lucide-angular [img]="icons.X" class="w-4 h-4"></lucide-angular>
        </button>
      </div>

      <!-- Search & Release -->
      <div class="relative mt-4 space-y-2.5">
        <div class="flex items-center gap-3 bg-white border border-slate-200 rounded-xl px-3.5 py-2.5 focus-within:border-indigo-500 focus-within:ring-2 focus-within:ring-indigo-500/10 shadow-2xs transition-all">
          <lucide-angular [img]="icons.Search" class="w-4 h-4 text-slate-400 shrink-0"></lucide-angular>
          <input (input)="onSearch($event)" placeholder="Search modules by name or code..." class="flex-1 bg-transparent border-0 text-xs font-bold text-slate-900 placeholder:text-slate-400 focus:outline-none focus:ring-0 w-full" />
        </div>
        <button type="button" (click)="releaseAll()" class="w-full py-2.5 px-3 rounded-xl bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 text-white text-xs font-black shadow-md shadow-emerald-600/20 flex items-center justify-center gap-2 cursor-pointer transition-all">
          <lucide-angular [img]="icons.Shield" class="w-3.5 h-3.5"></lucide-angular>
          <span>Release All Modules (Active &amp; Unlocked)</span>
        </button>
      </div>
    </header>

    <!-- Body -->
    <section class="min-h-0 flex-1 overflow-y-auto overscroll-contain p-3 scrollbar-thin bg-slate-50/50">
      <div class="space-y-2">
        <div *ngFor="let module of filteredModules"
             class="group flex items-center justify-between p-3 rounded-2xl border bg-white shadow-2xs hover:shadow-sm hover:border-indigo-200 transition-all"
             [class.border-slate-200]="!module.hidden"
             [class.border-amber-200]="module.hidden"
             [class.opacity-75]="module.hidden">
          <div class="flex items-center gap-3 min-w-0">
            <div class="w-9 h-9 rounded-xl flex items-center justify-center shrink-0 transition-colors"
                 [class.bg-indigo-50]="!module.hidden"
                 [class.text-indigo-600]="!module.hidden"
                 [class.bg-slate-100]="module.hidden"
                 [class.text-slate-400]="module.hidden">
              <lucide-angular [img]="icons.Folder" class="w-4 h-4"></lucide-angular>
            </div>
            <div class="min-w-0">
              <div class="text-xs font-black text-slate-900 tracking-tight truncate">{{module.label}}</div>
              <div class="text-[10px] font-mono text-slate-500 truncate">{{module.code}}</div>
            </div>
          </div>
          <div class="flex items-center gap-2 shrink-0">
            <span class="px-2 py-0.5 rounded-lg text-[9px] font-black uppercase tracking-wider border"
                  [class.bg-emerald-50]="!module.hidden"
                  [class.text-emerald-700]="!module.hidden"
                  [class.border-emerald-200]="!module.hidden"
                  [class.bg-amber-50]="module.hidden"
                  [class.text-amber-700]="module.hidden"
                  [class.border-amber-200]="module.hidden">
              {{ module.hidden ? 'Hidden' : 'Visible' }}
            </span>
            <button type="button" (click)="toggleHidden(module)"
                    class="w-8 h-8 rounded-xl border border-slate-200 flex items-center justify-center text-slate-500 hover:text-indigo-600 hover:border-indigo-200 hover:bg-indigo-50 transition-colors cursor-pointer"
                    [title]="module.hidden ? 'Show module' : 'Hide module'">
              <lucide-angular [img]="module.hidden ? icons.EyeOff : icons.Eye" class="w-4 h-4"></lucide-angular>
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- Footer -->
    <footer class="border-t border-slate-200/80 bg-white px-6 py-4 flex items-center justify-between gap-3 shrink-0">
      <span class="text-[11px] font-bold text-slate-500 tabular-nums">{{ filteredModules.length }} listed</span>
      <button type="button" (click)="onClose()" class="px-5 py-2 rounded-xl bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white text-xs font-black transition-all shadow-sm cursor-pointer">
        Done
      </button>
    </footer>

  </aside>
</div>
