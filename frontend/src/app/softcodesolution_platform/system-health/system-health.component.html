<!-- SCS_DASHBOARD_SYSTEM_HEALTH_COMPONENT_V1_START -->
<div
  *ngIf="userRole === 'SUPER_ADMIN' && page"
  class="px-4 sm:px-6 lg:px-8 py-6 max-w-[98rem] mx-auto space-y-6 animate-fade-in">

  <!-- Executive 3D Frosted System Health Hero -->
  <div class="rounded-[28px] p-5 sm:p-7 border border-white/80 shadow-[0_20px_50px_-12px_rgba(16,185,129,0.18),0_8px_20px_-6px_rgba(0,0,0,0.06),inset_0_1px_2px_rgba(255,255,255,0.95)] bg-gradient-to-br from-white/95 via-emerald-50/40 to-slate-50/90 backdrop-blur-2xl relative overflow-hidden">
    <div class="absolute inset-0 bg-[radial-gradient(#8080800c_1px,transparent_1px)] [background-size:20px_20px] pointer-events-none"></div>
    <div class="absolute -right-16 -top-16 w-80 h-80 bg-gradient-to-br from-emerald-200/40 via-teal-100/30 to-transparent rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute top-0 left-0 right-0 h-px bg-gradient-to-r from-transparent via-white/80 to-transparent"></div>
    <div class="relative z-10 flex flex-col lg:flex-row lg:items-center justify-between gap-6">
      <div class="flex items-start gap-4">
        <div class="w-14 h-14 sm:w-16 sm:h-16 rounded-[20px] bg-gradient-to-br from-emerald-500 via-teal-600 to-indigo-600 text-white shadow-xl shadow-emerald-600/25 flex items-center justify-center shrink-0 border border-white/40 ring-1 ring-emerald-500/20">
          <lucide-icon [name]="page.icon" class="w-7 h-7 sm:w-8 sm:h-8"></lucide-icon>
        </div>
        <div class="min-w-0">
          <div class="flex flex-wrap items-center gap-2 mb-1.5">
            <span class="px-2.5 py-0.5 rounded-lg bg-emerald-100/80 text-emerald-800 border border-emerald-200/80 text-[10px] font-black uppercase tracking-widest">
              {{ page.badge }}
            </span>
            <span class="px-2.5 py-0.5 rounded-lg bg-emerald-50 text-emerald-700 border border-emerald-200/80 text-[10px] font-black uppercase tracking-widest flex items-center gap-1.5">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
              All Systems Operational
            </span>
          </div>
          <h1 class="text-2xl sm:text-3xl font-black text-slate-900 tracking-tight leading-tight">
            {{ page.title }}
          </h1>
          <p class="text-xs sm:text-sm text-slate-600 font-medium mt-1 max-w-2xl leading-relaxed">
            {{ page.subtitle }}
          </p>
        </div>
      </div>

      <div class="flex items-center gap-3 shrink-0 flex-wrap">
        <div class="bg-white/90 px-4 py-2.5 rounded-2xl border border-slate-200/80 shadow-xs text-right">
          <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block">Health Groups</span>
          <span class="text-lg font-black text-slate-900 tabular-nums">{{ (page.groups || []).length }} Clusters</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Quick Navigation Controls -->
  <div class="flex flex-wrap gap-2">
    <button
      type="button"
      *ngFor="let link of page.quickLinks || []"
      (click)="openView(link.view)"
      class="px-4 py-2.5 rounded-xl scs-tile-3d text-slate-700 text-xs font-black hover:text-slate-900 transition-all cursor-pointer">
      {{ link.title }} &rarr;
    </button>
  </div>

  <!-- Health & Telemetry Cluster Cards -->
  <div class="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-5">
    <div
      *ngFor="let group of page.groups || []; let idx = index"
      class="scs-surface-3d rounded-[24px] hover:shadow-md transition-all overflow-hidden flex flex-col">

      <div class="px-5 py-4 border-b border-slate-100 bg-white flex items-center justify-between gap-3">
        <div class="flex items-center gap-3 min-w-0">
          <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-emerald-600 via-emerald-600 to-teal-600 text-white font-black text-xs flex items-center justify-center shrink-0 shadow-xs tabular-nums">
            0{{ idx + 1 }}
          </div>
          <div class="min-w-0">
            <p class="text-[10px] font-black uppercase tracking-widest text-indigo-600">
              Telemetry Cluster
            </p>
            <h3 class="text-sm font-black text-slate-900 tracking-tight truncate">
              {{ group.title }}
            </h3>
          </div>
        </div>
        <span class="text-[10px] font-black px-2 py-0.5 rounded-lg bg-emerald-50 text-emerald-700 border border-emerald-200/80 shrink-0 tabular-nums">
          {{ (group.items || []).length }} checks
        </span>
      </div>

      <div class="p-3.5 space-y-1.5 flex-1">
        <div
          *ngFor="let item of group.items || []"
          class="flex items-center justify-between px-3 py-2.5 rounded-xl bg-white border border-slate-100 hover:border-slate-200 transition-all">

          <div class="flex items-center gap-2.5 min-w-0">
            <div class="w-2 h-2 rounded-full bg-emerald-500 flex-shrink-0 shadow-[0_0_6px_rgba(16,185,129,0.5)]"></div>
            <span class="text-xs font-bold text-slate-700 truncate">
              {{ item }}
            </span>
          </div>

          <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-lg bg-emerald-50 text-emerald-700 border border-emerald-100 text-[10px] font-black uppercase tracking-wider shrink-0">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
            Live
          </span>
        </div>
      </div>
    </div>
  </div>
</div>
<!-- SCS_DASHBOARD_SYSTEM_HEALTH_COMPONENT_V1_END -->
