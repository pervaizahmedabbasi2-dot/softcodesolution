<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SoftCode Solution</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <!-- Inter Font for Apple-like aesthetics on non-Apple devices -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="192x192" href="/logos/logo-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/logos/logo-512.png">
  <link rel="apple-touch-icon" href="/logos/logo-192.png">
  <link rel="manifest" href="/manifest.json">
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').then(registration => {
          console.log('ServiceWorker registration successful with scope: ', registration.scope);
        }).catch(err => {
          console.log('ServiceWorker registration failed: ', err);
        });
      });
    }
  </script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
  </style>
</head>
<body class="bg-[#F2F2F7] text-[#1D1D1F] antialiased selection:bg-blue-500 selection:text-white tracking-tight">
  <app-root></app-root>
</body>
</html>
